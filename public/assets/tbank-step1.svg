<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone body -->
  <rect x="30" y="20" width="340" height="560" rx="30" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="45" y="35" width="310" height="530" rx="25" fill="#0066cc"/>
  
  <!-- Status bar -->
  <rect x="45" y="35" width="310" height="30" fill="#0052a3"/>
  <text x="60" y="55" font-size="12" fill="#fff" font-family="sans-serif">00:12</text>
  <text x="320" y="55" font-size="10" fill="#fff" font-family="sans-serif">●●●●●</text>
  
  <!-- Header -->
  <text x="200" y="90" font-size="20" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">Оплатить и получить</text>
  
  <!-- Card section -->
  <rect x="70" y="120" width="260" height="80" rx="12" fill="#fff" opacity="0.95"/>
  <circle cx="85" cy="145" r="8" fill="#0066cc"/>
  <text x="100" y="152" font-size="14" fill="#000" font-family="sans-serif" font-weight="bold">Платить продавцам</text>
  
  <!-- QR Code (simplified) -->
  <rect x="80" y="220" width="240" height="240" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="85" y="225" width="30" height="30" fill="#000"/>
  <rect x="335" y="225" width="30" height="30" fill="#000"/>
  <rect x="85" y="425" width="30" height="30" fill="#000"/>
  
  <!-- Grid pattern for QR -->
  <g stroke="#000" stroke-width="1" opacity="0.5">
    <line x1="120" y1="225" x2="120" y2="455"/>
    <line x1="155" y1="225" x2="155" y2="455"/>
    <line x1="190" y1="225" x2="190" y2="455"/>
    <line x1="225" y1="225" x2="225" y2="455"/>
    <line x1="260" y1="225" x2="260" y2="455"/>
    <line x1="295" y1="225" x2="295" y2="455"/>
  </g>
  
  <!-- Alipay icon in center -->
  <circle cx="200" cy="330" r="20" fill="#0066cc"/>
  <text x="200" y="337" font-size="24" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">¥</text>
  
  <!-- Buttons -->
  <rect x="80" y="480" width="110" height="35" rx="6" fill="#f0f0f0" stroke="#ddd"/>
  <text x="135" y="503" font-size="12" fill="#666" font-family="sans-serif" text-anchor="middle">Ввести сумму</text>
  
  <rect x="210" y="480" width="110" height="35" rx="6" fill="#f0f0f0" stroke="#ddd"/>
  <text x="265" y="503" font-size="12" fill="#666" font-family="sans-serif" text-anchor="middle">Сохранить</text>
</svg>