<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#f5f5f5"/>
  
  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="40" fill="#ff6b6b" opacity="0.1"/>
  <circle cx="520" cy="320" r="50" fill="#0066cc" opacity="0.1"/>
  
  <!-- Main envelope -->
  <rect x="100" y="80" width="400" height="240" rx="20" fill="#ff6b6b"/>
  
  <!-- Envelope flap -->
  <polygon points="100,80 300,140 500,80" fill="#ff5252"/>
  
  <!-- Envelope body light -->
  <rect x="100" y="140" width="400" height="180" rx="0 0 20 20" fill="#ff8787"/>
  
  <!-- Money inside - left bill -->
  <rect x="140" y="160" width="110" height="70" rx="4" fill="#f0ad4e" transform="rotate(-15 195 195)"/>
  <text x="195" y="205" font-size="32" fill="#8b6f47" font-family="serif" text-anchor="middle" font-weight="bold">₽</text>
  
  <!-- Money inside - right bill -->
  <rect x="280" y="150" width="110" height="70" rx="4" fill="#d4af37" transform="rotate(8 335 185)"/>
  <text x="335" y="200" font-size="32" fill="#9a7e24" font-family="serif" text-anchor="middle" font-weight="bold">¥</text>
  
  <!-- Ribbon accent -->
  <rect x="140" y="220" width="320" height="8" rx="4" fill="#fff" opacity="0.3"/>
  
  <!-- Text -->
  <text x="300" y="340" font-size="28" fill="#1a1a1a" font-family="sans-serif" font-weight="bold" text-anchor="middle">Т-Банк</text>
  <text x="300" y="370" font-size="14" fill="#666" font-family="sans-serif" text-anchor="middle">Надежный способ пополнить Alipay</text>
</svg>