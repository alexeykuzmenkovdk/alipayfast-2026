<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF"/><stop offset="1" stop-color="#0B63D6"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF"/><stop offset="1" stop-color="#0A5BD3"/>
    </linearGradient>
    <pattern id="qr" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff"/>
      <rect width="12" height="12" fill="#111"/>
      <rect x="12" y="12" width="12" height="12" fill="#111"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="#EEF1F6"/>
  <rect x="16" y="16" width="868" height="1168" rx="46" fill="#FFFFFF"/>

  <!-- status bar -->
  <text x="52" y="80" font-size="26" font-weight="600" fill="#1F2329">9:41</text>
  <rect x="750" y="56" width="34" height="18" rx="5" fill="#1F2329"/>
  <rect x="792" y="56" width="26" height="18" rx="5" fill="#1F2329"/>
  <rect x="826" y="56" width="40" height="18" rx="6" fill="#1F2329"/>

  <!-- header -->
  <rect x="16" y="104" width="868" height="118" rx="46" fill="url(#hdr)"/>
  <rect x="16" y="192" width="868" height="30" fill="url(#hdr)"/>
  <path d="M70 172 l-18 -18 l18 -18" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="176" font-size="32" font-weight="600" fill="#fff" text-anchor="middle">Как пользоваться</text>

  <g transform="translate(0,88)">
  
  <text x="60" y="200" font-size="24" fill="#8A9099" text-anchor="start">Вход и выход: сканируем один и тот же код</text>

  <rect x="60" y="240" width="780" height="420" rx="26" fill="#F0F3F8"/>
  <rect x="140" y="300" width="90" height="300" rx="16" fill="#D8DEE8"/>
  <rect x="640" y="300" width="90" height="300" rx="16" fill="#D8DEE8"/>
  <rect x="600" y="380" width="44" height="140" rx="10" fill="#0FAF6A" opacity="0.25"/>
  <rect x="596" y="376" width="52" height="148" rx="12" fill="none" stroke="#FFC400" stroke-width="8"/>
  <text x="670" y="570" font-size="22" font-weight="500" fill="#8A9099" text-anchor="start">сканер</text>
  <rect x="330" y="400" width="150" height="230" rx="24" fill="#1F2329"/>
  <rect x="352" y="424" width="106" height="182" rx="10" fill="#EAF2FF"/>
  <rect x="376" y="470" width="58" height="58" fill="url(#qr)"/>
  <text x="405" y="700" font-size="22" font-weight="500" fill="#0B63D6" text-anchor="middle">телефон 5–10 см</text>
  <path d="M486 500 h100" stroke="#0FAF6A" stroke-width="8" stroke-dasharray="12 10"/>
  <text x="600" y="512" font-size="34" fill="#0FAF6A">▶</text>

  <rect x="60" y="700" width="380" height="150" rx="22" fill="#EAF2FF"/>
  <text x="96" y="756" font-size="28" font-weight="700" fill="#0B63D6" text-anchor="start">Вход</text>
  <text x="96" y="800" font-size="21" fill="#8A9099" text-anchor="start">приложили код — турникет открылся</text>

  <rect x="460" y="700" width="380" height="150" rx="22" fill="#FFF8E6"/>
  <text x="496" y="756" font-size="28" font-weight="700" fill="#C77800" text-anchor="start">Выход</text>
  <text x="496" y="800" font-size="21" fill="#8A9099" text-anchor="start">сканируем снова — считают стоимость</text>
  </g>

  <text x="450" y="1148" font-size="26" fill="#8A9099" text-anchor="middle">Шаг 8. Правило двух сканирований</text>
</svg>
