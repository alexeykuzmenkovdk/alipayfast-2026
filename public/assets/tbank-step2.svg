<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone body -->
  <rect x="30" y="20" width="340" height="560" rx="30" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="45" y="35" width="310" height="530" rx="25" fill="#1a1a2e"/>
  
  <!-- Status bar -->
  <rect x="45" y="35" width="310" height="30" fill="#0f0f1e"/>
  <text x="60" y="55" font-size="12" fill="#fff" font-family="sans-serif">00:12</text>
  <text x="320" y="55" font-size="10" fill="#fff" font-family="sans-serif">●●●●●</text>
  
  <!-- Header -->
  <text x="200" y="90" font-size="16" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">Выписка по операции</text>
  
  <!-- Amount section -->
  <rect x="70" y="120" width="260" height="60" rx="8" fill="#2a2a3e"/>
  <text x="200" y="145" font-size="28" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">3 500 ₽</text>
  <text x="200" y="170" font-size="11" fill="#999" font-family="sans-serif" text-anchor="middle">Итого</text>
  
  <!-- Receipt details -->
  <rect x="70" y="200" width="260" height="150" rx="8" fill="#2a2a3e"/>
  
  <rect x="80" y="210" width="40" height="40" rx="4" fill="#ff6b6b"/>
  <text x="100" y="237" font-size="20" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">T</text>
  
  <text x="130" y="225" font-size="12" fill="#fff" font-family="sans-serif" font-weight="bold">Т-Банк</text>
  <text x="130" y="240" font-size="10" fill="#999" font-family="sans-serif">17.12.2024 20:45</text>
  
  <!-- Share button (red) -->
  <circle cx="320" cy="230" r="15" fill="#ff6b6b"/>
  <text x="320" y="237" font-size="18" fill="#fff" font-family="sans-serif" text-anchor="middle">⤴</text>
  
  <line x1="80" y1="260" x2="330" y2="260" stroke="#444" stroke-width="1"/>
  
  <text x="80" y="280" font-size="11" fill="#fff" font-family="sans-serif">receipt_17.12.2024.pdf</text>
  <text x="80" y="300" font-size="10" fill="#666" font-family="sans-serif">58 kB</text>
  
  <!-- Action buttons -->
  <rect x="70" y="380" width="260" height="40" rx="6" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="2"/>
  <text x="200" y="407" font-size="12" fill="#ff6b6b" font-family="sans-serif" font-weight="bold" text-anchor="middle">Отправить по почте</text>
  
  <!-- Share icons -->
  <g transform="translate(70, 450)">
    <rect x="0" y="0" width="45" height="45" rx="6" fill="#ff6b6b"/>
    <text x="22.5" y="27" font-size="18" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">T</text>
    
    <rect x="55" y="0" width="45" height="45" rx="6" fill="#0066cc"/>
    <text x="77.5" y="27" font-size="18" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">✉</text>
    
    <rect x="110" y="0" width="45" height="45" rx="6" fill="#25d366"/>
    <text x="132.5" y="27" font-size="18" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">💬</text>
    
    <rect x="165" y="0" width="45" height="45" rx="6" fill="#0088cc"/>
    <text x="187.5" y="27" font-size="16" fill="#fff" font-family="sans-serif" font-weight="bold" text-anchor="middle">✈</text>
  </g>
</svg>