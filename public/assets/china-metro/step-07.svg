<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF"/><stop offset="1" stop-color="#0B63D6"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1677FF"/><stop offset="1" stop-color="#0A5BD3"/>
    </linearGradient>
    <pattern id="qr" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff"/>
      <rect width="12" height="12" fill="#111"/>
      <rect x="12" y="12" width="12" height="12" fill="#111"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="#EEF1F6"/>
  <rect x="16" y="16" width="868" height="1168" rx="46" fill="#FFFFFF"/>

  <!-- status bar -->
  <text x="52" y="80" font-size="26" font-weight="600" fill="#1F2329">9:41</text>
  <rect x="750" y="56" width="34" height="18" rx="5" fill="#1F2329"/>
  <rect x="792" y="56" width="26" height="18" rx="5" fill="#1F2329"/>
  <rect x="826" y="56" width="40" height="18" rx="6" fill="#1F2329"/>

  <!-- header -->
  <rect x="16" y="104" width="868" height="118" rx="46" fill="url(#hdr)"/>
  <rect x="16" y="192" width="868" height="30" fill="url(#hdr)"/>
  <path d="M70 172 l-18 -18 l18 -18" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="176" font-size="32" font-weight="600" fill="#fff" text-anchor="middle">Другие города</text>

  <g transform="translate(0,88)">
  
  <rect x="60" y="180" width="420" height="84" rx="42" fill="#EAF2FF"/>
  <text x="110" y="234" font-size="28" font-weight="600" fill="#0B63D6" text-anchor="start">公交地铁 · 上海 ▾</text>
  <rect x="50" y="170" width="440" height="104" rx="52" fill="none" stroke="#FFC400" stroke-width="8"/>

  <rect x="60" y="300" width="780" height="90" rx="20" fill="#F7F8FA"/>
  <text x="110" y="358" font-size="28" font-weight="500" fill="#1F2329" text-anchor="start">🔍  Beijing</text>
  <rect x="50" y="292" width="800" height="106" rx="22" fill="none" stroke="#FFC400" stroke-width="8"/>

  
  <rect x="60" y="430" width="780" height="110" rx="20" fill="#EAF2FF"/>
  <text x="100" y="500" font-size="30" font-weight="700" fill="#0B63D6" text-anchor="start">Пекин</text>
  <text x="100" y="500" font-size="22" fill="#8A9099" text-anchor="start">北京 Beijing</text>
  <path d="M760 475 l18 20 l34 -40" stroke="#1677FF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="60" y="560" width="780" height="110" rx="20" fill="#F7F8FA"/>
  <text x="100" y="630" font-size="30" font-weight="500" fill="#1F2329" text-anchor="start">Ханчжоу</text>
  <text x="100" y="630" font-size="22" fill="#8A9099" text-anchor="start">杭州</text>
  
  
  <rect x="60" y="690" width="780" height="110" rx="20" fill="#F7F8FA"/>
  <text x="100" y="760" font-size="30" font-weight="500" fill="#1F2329" text-anchor="start">Сучжоу</text>
  <text x="100" y="760" font-size="22" fill="#8A9099" text-anchor="start">苏州</text>
  

  <rect x="60" y="840" width="780" height="150" rx="22" fill="#EAF2FF"/>
  <text x="100" y="900" font-size="26" font-weight="600" fill="#0B63D6" text-anchor="start">Все коды сохраняются в аккаунте</text>
  <text x="100" y="944" font-size="22" fill="#8A9099" text-anchor="start">В поездке город меняется одним нажатием</text>
  </g>

  <text x="450" y="1148" font-size="26" fill="#8A9099" text-anchor="middle">Шаг 7. Заранее оформляем коды для всех городов</text>
